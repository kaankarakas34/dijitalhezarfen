<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#02040A" />
    </linearGradient>
    <!-- Text/Glow Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Square -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Subtle Inner Glow -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="6" />

  <!-- Text "DH" -->
  <text x="50%" y="52%" 
        font-family="Outfit, Inter, system-ui, sans-serif" 
        font-size="210" 
        font-weight="900" 
        fill="url(#textGrad)" 
        text-anchor="middle" 
        dominant-baseline="middle" 
        letter-spacing="-6">DH</text>
</svg>